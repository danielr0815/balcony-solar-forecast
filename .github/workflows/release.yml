name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (already committed on main)"
        required: true
        type: string
      commit_sha:
        description: "Full 40-character main commit SHA with a green Validate push run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Check versions and complete CI on the exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$RELEASE_SHA&event=push" > "$RUNNER_TEMP/runs.json"
          python scripts/release_guard.py --version "$RELEASE_VERSION" --commit-sha "$RELEASE_SHA" --runs-json "$RUNNER_TEMP/runs.json" --notes-file "$RUNNER_TEMP/release-notes.md"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    # Only this job may publish; a rejected preflight never reaches it.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Recheck immediately before creating tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$RELEASE_SHA&event=push" > "$RUNNER_TEMP/runs.json"
          python scripts/release_guard.py --version "$RELEASE_VERSION" --commit-sha "$RELEASE_SHA" --runs-json "$RUNNER_TEMP/runs.json" --notes-file "$RUNNER_TEMP/release-notes.md"
          # No force: an existing tag on another commit must reject the push.
          git push origin "$RELEASE_SHA:refs/tags/v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
